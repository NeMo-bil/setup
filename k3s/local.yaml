grafana:
  enabled: true

postgis:
  primary:
    persistence:
      enabled: false
  readReplicas:
    persistence:
      enabled: false
mqtt:
  global:
    traefik:
      fixedMiddlewares: []
    fallbackDefaults:
      storageClass: local-path
  enabled: true
  ingress:
    main:
      enabled: true
      integrations:
        traefik:
          enabled: false
          # Default to websecure
          entrypoints: []
          # Ensures tls annotation is set
          forceTLS: false
      hosts:
        - # -- Host address. Helm template can be passed.
          host: mqtt.127.0.0.1.nip.io
          #     ## Configure the paths for the host
          paths:
            - # -- Path.  Helm template can be passed.
              path: /

scorpio:
  logging:
    level: TRACE
  ingress:
    enabled: true
    # only to make it available for the test initialization
    hosts:
      - host: context-broker.127.0.0.1.nip.io
        paths:
          - "/"

importData:
  enabled: false
  contextBroker: context-broker.127.0.0.1.nip.io:8080
  data: |-
    [
      {
        "id": "urn:ngsi-ld:vehicle:someCab",
        "type": "Vehicle",
        "description": {
          "type": "Property",
          "value": "Some cab"
        },
        "location": {
          "type": "GeoProperty",
          "value": {
            "type": "Point",
            "coordinates": [
              10.890079039102002,
              48.0540141182173
            ]
          }
        }
      }
    ]

reisewitz:
  enabled: true
  ingress:
    enabled: true
    hosts:
      - host: reisewitz.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: Prefix
  args:
    #- "--print-all-network-traffic"
    - "--verbose"
    - "--port=9021"
    - "--max-request-journal=1000"
    - "--local-response-templating"
    - "--root-dir=/home/wiremock/storage"
  mappings:
    request.json: |
      {
        "request": {
          "urlPath": "/notification/booking",
          "method": "POST"
        },
        "response": {
          "status": 200
        },
        "serveEventListeners": [
          {
            "name": "webhook",
            "parameters": {
              "method": "POST",
              "url": "http://context-broker.127.0.0.1.nip.io:8080/ngsi-ld/v1/entityOperations/create",
              "headers": {
                "Content-Type": "application/json",
                "Link": "<http://context-file:9000/context-file/ngsild-context.jsonld>; rel=\"http://www.w3.org/ns/json-ld#context\"; type=\"application/ld+json\""
              },
              "body": "[{\"id\":\"urn:ngsi-ld:TripProposal:{{randomValue type='UUID'}}\",\"type\":\"TripProposal\",\"cabPickupLocation\":{\"type\":\"GeoProperty\", \"value\":{{jsonPath originalRequest.body '$.data[0].startLocation'}} },\"cabDropoffLocation\":{\"type\":\"GeoProperty\", \"value\":{{jsonPath originalRequest.body '$.data[0].targetLocation'}} },\"pickupTime\":{\"type\":\"Property\",\"value\":\"2024-08-09T12:00:00Z\"},\"proposalReleaseTime\":{\"type\":\"Property\",\"value\":\"2024-08-08T18:00:00Z\"},\"request\":{\"type\":\"Relationship\",\"object\":\"{{jsonPath originalRequest.body '$.data[0].id'}}\"}}]"
            }
          }
        ]
      }
    trip.json: |
      {
        "request": {
          "urlPath": "/notification/trip",
          "method": "POST"          
        },
        "response": {
          "status": 200
        },
        "serveEventListeners": [
          {
            "name": "webhook",
            "parameters": {
              "method": "PATCH",
              "url": "http://context-broker.127.0.0.1.nip.io:8080/ngsi-ld/v1/entities/{{jsonPath originalRequest.body '$.data[0].id'}}/attrs/status",
              "headers": {
                "Content-Type": "application/json",
                "Link": "<http://context-file:9000/context-file/ngsild-context.jsonld>; rel=\"http://www.w3.org/ns/json-ld#context\"; type=\"application/ld+json\""
              },
              "body": "{\"value\": [\"Planned\"],\"type\": \"Property\"}"
            }
          }
        ]
      }
    tripplanned.json: |
      {
        "request": {
          "urlPath": "/notification/tripplanned",
          "method": "POST"          
        },
        "response": {
          "status": 200
        },
        "serveEventListeners": [
          {
            "name": "webhook",
            "parameters": {
              "method": "PATCH",
              "url": "http://context-broker.127.0.0.1.nip.io:8080/ngsi-ld/v1/entities/urn:ngsi-ld:vehicle:001/attrs/nextStopLocation",
              "headers": {
                "Content-Type": "application/json",
                "Link": "<http://context-file:9000/context-file/ngsild-context.jsonld>; rel=\"http://www.w3.org/ns/json-ld#context\"; type=\"application/ld+json\""
              },
              "body": "{{jsonPath originalRequest.body '$.data[0].pickupLocation'}}"
            }
          }
        ]
      }

rw-request-subscription:
  enabled: true
  subscription: |
    {
      "description": "Notify me of trip requests",
      "type": "Subscription",
      "entities": [{"type": "TripRequest"}],
      "notification": {
        "attributes": ["user", "startLocation", "targetLocation"],
        "format": "keyValues",
        "endpoint": {
          "uri": "http://reisewitz.127.0.0.1.nip.io:8080/notification/booking",
          "accept": "application/json"
        }
      },
      "@context": ["http://context-file:9000/context-file/ngsild-context.jsonld"]
    }

rw-trip-subscription:
  enabled: true
  subscription: |
    {
      "description": "Notify me of booking changes",
      "type": "Subscription",
      "entities": [{"type": "Trip"}],
      "watchedAttributes": ["status"],
      "q": "status==%22Unplanned%22",
      "notification": {
        "attributes": ["user"],
        "format": "keyValues",
        "endpoint": {
          "uri": "http://reisewitz.127.0.0.1.nip.io:8080/notification/trip",
          "accept": "application/json"
        }
      },
      "@context": ["http://context-file:9000/context-file/ngsild-context.jsonld"]
    }

# Subscription simulating the triggering of a vehicle scheduling in the operational planning
rw-trip-plan-subscription:
  enabled: true
  subscription: |
    {
      "description": "Subscription simulating the triggering of a vehicle scheduling in the operational planning",
      "type": "Subscription",
      "entities": [{"type": "Trip"}],
      "watchedAttributes": ["status"],
      "q": "status==%22Planned%22",
      "notification": {
        "attributes": ["pickupLocation","status"],
        "format": "keyValues",
        "endpoint": {
          "uri": "http://reisewitz.127.0.0.1.nip.io:8080/notification/tripplanned",
          "accept": "application/json"
        }
      },
      "@context": ["http://context-file:9000/context-file/ngsild-context.jsonld"]
    }

nodered-vehicle-subscription:
  enabled: true
  subscription: |
    {
      "description": "Subscription for informing vehicles of new destinations",
      "type": "Subscription",
      "entities": [{"type": "Vehicle"}],
      "watchedAttributes": ["nextStopLocation"],
      "notification": {
        "attributes": ["nextStopLocation"],
        "format": "keyValues",
        "endpoint": {
          "uri": "http://node-red.127.0.0.1.nip.io:8080/notification",
          "accept": "application/json"
        }
      },
      "@context": ["http://context-file:9000/context-file/ngsild-context.jsonld"]
    }