# -- configuration to be shared between the context-broker components
contextBroker:
  generatePasswords:
    # -- should a password for the database connection of context-broker components be generated in the cluster
    enabled: true
    #-- name of the secret to put the generated password into
    secretName: context-broker-secret

mqtt:
  global:
    traefik:
      fixedMiddlewares: []
    fallbackDefaults:
      storageClass: local-path
      pvcSize: 1Gi
  enabled: true
  ingress:
    main:
      enabled: true
      hosts:
        - # -- Host address. Helm template can be passed.
          host: mqtt.127.0.0.1.nip.io
          #     ## Configure the paths for the host
          paths:
            - # -- Path.  Helm template can be passed.
              path: /

nodered:
  enabled: true
  env:
    - name: "NGSI_LD_SERVER"
      value: context-broker.127.0.0.1.nip.io:8080
  ingress:
    enabled: true
    hosts:
      - host: node-red.127.0.0.1.nip.io
